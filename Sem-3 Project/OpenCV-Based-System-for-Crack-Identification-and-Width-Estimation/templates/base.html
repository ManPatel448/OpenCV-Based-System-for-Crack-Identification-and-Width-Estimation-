<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Crack Detection{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/upload">Crack Detection</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNavbar">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/upload' or request.path == '/' %}active fw-semibold{% endif %}" href="/upload">Upload</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path.startswith('/history') %}active fw-semibold{% endif %}" href="/history">History</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
<main class="container py-4">{% block content %}{% endblock %}</main>
<div class="image-lightbox" id="image-lightbox" hidden role="dialog" aria-modal="true" aria-label="Image preview">
  <button class="image-lightbox-close" type="button" aria-label="Close image preview">&times;</button>
  <figure class="image-lightbox-content">
    <div class="image-lightbox-toolbar" role="toolbar" aria-label="Image zoom controls">
      <button type="button" data-image-zoom="out" aria-label="Zoom out">−</button>
      <button type="button" data-image-zoom="reset">Reset</button>
      <button type="button" data-image-zoom="in" aria-label="Zoom in">+</button>
      <span id="image-lightbox-zoom">100%</span>
    </div>
    <img id="image-lightbox-image" alt="">
    <figcaption id="image-lightbox-caption"></figcaption>
  </figure>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
